<div class="products-grid">
    <div *ngFor="let product of product_array" class="product-item">
        <div class="product-badge new">Mới</div>
        <img src="{{product.hinh}}" alt="{{product.ten_sp}}">
        <a [routerLink]="['/product', product.slug]">
            <h3>{{product.ten_sp}}</h3>
        </a>
        <div class="product-rating">
            <span class="stars">★★★★☆</span>
            <span class="rating-count">({{product.luot_xem}})</span>
        </div>
        <p class="price">{{product.gia ? product.gia.toLocaleString('vi-VN') : 'Liên Hệ'}}₫</p>
        <button (click)="this.cartService.addToCart(product)" class="add-to-cart">Thêm vào giỏ</button>
    </div>
</div>
