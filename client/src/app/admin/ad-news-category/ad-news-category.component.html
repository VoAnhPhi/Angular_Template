<div class="content">
    <div class="page-title-container">
        <h1 class="page-title">Danh Mục Tin Tức</h1>
        <p class="page-subtitle">Quản Lý Danh Mục Tin Tức</p>
    </div>

    <!-- Categories Table -->
    <div class="data-table-container">
        <div class="table-header-admin">
            <div class="table-title">Tất Cả Danh Mục</div>
            <div class="table-actions">
                <div class="search-box-admin">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Tìm kiếm danh mục...">
                </div>
                <a routerLink="/admin/news-category-add" class="btn-admin btn-primary-admin">
                    <i class="fas fa-plus"></i> Thêm Danh Mục
                </a>
            </div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Danh Mục</th>
                    <th>Slug</th>
                    <th>Số Bài Viết</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let category of news_category">
                    <td>{{category.id}}</td>
                    <td>{{category.ten_loai}}</td>
                    <td>{{category.slug}}</td>
                    <td>{{category.count}}</td>
                    <td> 
                        <ng-container *ngIf="category.an_hien == 1">
                            <span class="status-badge status-delivered">Hiển Thị</span>
                        </ng-container>
                        <ng-container *ngIf="category.an_hien == 0">
                            <span class="status-badge status-cancelled">Ẩn</span>
                        </ng-container>
                    </td>
                    <td>
                        <div class="action-btns">
                            <a [routerLink]="['/admin/news-category-edit', category.id]" class="btn-icon btn-edit"><i class="fas fa-edit"></i></a>
                            <button class="btn-icon btn-delete" (click)="deleteNewsCategory(category.id)"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
                <!-- <td><span class="status-badge status-inactive">Inactive</span></td> -->
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination-container">
            <ul class="pagination">
                <li class="page-item disabled">
                    <a href="#" class="page-link">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>
                <li class="page-item active"><a href="#" class="page-link">1</a></li>
                <li class="page-item"><a href="#" class="page-link">2</a></li>
                <li class="page-item">
                    <a href="#" class="page-link">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
